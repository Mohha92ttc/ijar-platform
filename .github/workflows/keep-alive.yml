# Keep Render free instance awake (external ping every 5 minutes)
name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production (health + home)
        run: |
          BASE="https://ijar-platform.onrender.com"
          echo "Pinging $BASE"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 120 "$BASE/api/health" && curl -fsS -o /dev/null --max-time 120 "$BASE/"; then
              echo ""
              echo "OK at attempt $i"
              exit 0
            fi
            echo "retry $i..."
            sleep 20
          done
          exit 1
