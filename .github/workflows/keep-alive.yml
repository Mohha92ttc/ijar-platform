# Keep Render free instance awake (ping every 10 minutes)
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production health
        run: |
          URL="https://ijar-platform.onrender.com/api/health"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo ""
              echo "OK"
              exit 0
            fi
            echo "retry $i..."
            sleep 15
          done
          exit 1
