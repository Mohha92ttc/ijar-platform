name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        continue-on-error: true
        run: |
          URL="https://ijar-platform.onrender.com/api/health"
          echo "Pinging $URL at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          ok=0
          for i in 1 2 3 4 5; do
            echo "--- attempt $i ---"
            code=$(curl -sS -o /tmp/health-body -w "%{http_code}" \
              --connect-timeout 30 --max-time 120 \
              -A "ijar-keepalive/1.0" \
              "$URL" || echo "000")
            echo "HTTP status: $code"
            if [ -f /tmp/health-body ]; then
              echo "Body:"; head -c 500 /tmp/health-body; echo
            fi
            if [ "$code" = "200" ]; then
              echo "OK — health check succeeded on attempt $i"
              ok=1
              break
            fi
            echo "Not ready yet; sleeping before retry..."
            sleep 20
          done

          if [ "$ok" != "1" ]; then
            echo "WARN — health check did not return 200 (soft fail; job continues)"
          fi
          # Soft fail: never fail the job if the site is briefly down
          exit 0